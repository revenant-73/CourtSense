<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CourtSense | Ecological Precision 2026</title>
    <!-- Tailwind CSS 4 CDN -->
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <!-- Google Fonts: Geist -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/geist@1.3.0/dist/fonts/geist-sans/style.css">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg-base: #0a0a0c;
            --card-glass: rgba(22, 22, 26, 0.75);
            --primary: #6366f1;
            --primary-glow: rgba(99, 102, 241, 0.4);
            --success: #10b981;
            --warning: #f97316;
            --text-dim: rgba(255, 255, 255, 0.5);
        }

        body {
            font-family: 'Geist Sans', sans-serif;
            background-color: var(--bg-base);
            color: #ffffff;
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* Distinct Visual Device: Technical Grid Overlay */
        .tech-grid {
            position: fixed;
            inset: 0;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: -1;
            pointer-events: none;
        }

        .mesh-bg {
            position: fixed;
            inset: 0;
            z-index: -2;
            background: 
                radial-gradient(circle at 0% 0%, rgba(99, 102, 241, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 100% 100%, rgba(16, 185, 129, 0.05) 0%, transparent 50%),
                #0a0a0c;
        }

        .glass {
            background: var(--card-glass);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        /* Distinct Visual Device: Scanning Line Animation */
        .scan-line {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--primary), transparent);
            opacity: 0.3;
            animation: scan 4s linear infinite;
        }

        @keyframes scan {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(500%); }
        }

        .athlete-card:hover {
            border-color: rgba(99, 102, 241, 0.5);
            box-shadow: 0 0 30px rgba(99, 102, 241, 0.15);
            transform: translateY(-2px);
        }

        .rating-segment {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .rating-segment.active {
            background: var(--primary);
            box-shadow: 0 0 12px var(--primary-glow);
        }
        .rating-segment:not(.active) {
            background: rgba(255, 255, 255, 0.15); /* Increased contrast from 0.1 */
        }

        .custom-scrollbar::-webkit-scrollbar {
            height: 3px;
            width: 3px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
        }

        /* Mobile Header Fix: No overlap at 375px */
        @media (max-width: 400px) {
            header .logo-text { font-size: 1rem; }
            header .session-pill { font-size: 0.65rem; padding: 2px 8px; }
        }
    </style>
</head>
<body class="antialiased">
    <div class="mesh-bg"></div>
    <div class="tech-grid"></div>

    <!-- Header Fix: Responsive layout to prevent collision -->
    <header class="sticky top-0 z-50 glass px-4 py-3 sm:px-6 sm:py-4 flex items-center justify-between border-b border-white/10">
        <div class="flex items-center gap-2 sm:gap-3 min-w-0">
            <div class="shrink-0 w-7 h-7 sm:w-8 sm:h-8 bg-indigo-600 rounded-lg flex items-center justify-center">
                <i data-lucide="activity" class="w-4 h-4 sm:w-5 sm:h-5 text-white"></i>
            </div>
            <h1 class="logo-text text-lg sm:text-xl font-black tracking-tighter text-indigo-500 truncate">COURTSENSE</h1>
        </div>
        <div class="session-pill text-[10px] sm:text-xs font-bold text-white/70 tracking-widest uppercase bg-indigo-500/10 px-2 sm:px-3 py-1 rounded-md border border-indigo-500/20 whitespace-nowrap ml-2">
            17U National
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 pt-6 pb-48 lg:pt-10">
        <!-- Dashboard Header Actions (Desktop focus) -->
        <div class="hidden lg:flex items-center justify-between mb-8">
            <div>
                <h2 class="text-3xl font-black tracking-tight">Evaluator Dashboard</h2>
                <p class="text-white/40 text-sm font-medium uppercase tracking-widest">Active Session: court_alpha_09</p>
            </div>
            <div class="flex gap-4">
                <div class="glass px-6 py-3 rounded-2xl flex items-center gap-6">
                    <div class="text-center">
                        <div class="text-xl font-bold">128</div>
                        <div class="text-[10px] text-white/40 uppercase font-bold">Total</div>
                    </div>
                    <div class="w-px h-8 bg-white/10"></div>
                    <div class="text-center text-emerald-400">
                        <div class="text-xl font-bold">42</div>
                        <div class="text-[10px] uppercase font-bold">Evaluated</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Global Actions -->
        <section class="flex flex-col lg:flex-row gap-4 mb-8">
            <div class="relative group lg:flex-1">
                <i data-lucide="search" class="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 text-white/40 group-focus-within:text-indigo-400 transition-colors"></i>
                <input type="text" placeholder="Search athlete ID or name..." class="w-full bg-white/5 border border-white/10 rounded-2xl py-4 pl-12 pr-4 text-sm focus:outline-none focus:border-indigo-500/50 focus:bg-white/10 transition-all placeholder:text-white/20">
            </div>

            <div class="flex items-center gap-2 overflow-x-auto pb-2 custom-scrollbar lg:pb-0">
                <button class="px-5 py-2 rounded-xl bg-indigo-600 text-xs font-bold whitespace-nowrap shadow-lg shadow-indigo-600/20">All Positions</button>
                <button class="px-5 py-2 rounded-xl glass text-xs font-medium text-white/60 hover:text-white whitespace-nowrap">Setter</button>
                <button class="px-5 py-2 rounded-xl glass text-xs font-medium text-white/60 hover:text-white whitespace-nowrap">Libero</button>
                <button class="px-5 py-2 rounded-xl glass text-xs font-medium text-white/60 hover:text-white whitespace-nowrap">Hitter</button>
            </div>

            <div class="flex items-center justify-between glass p-2 pl-4 rounded-2xl lg:min-w-[200px]">
                <span class="text-xs font-bold text-white/40 uppercase tracking-wider">Checked In</span>
                <button class="w-10 h-5 rounded-full bg-emerald-500/20 border border-emerald-500/30 relative transition-colors">
                    <div class="absolute right-0.5 top-0.5 w-3.5 h-3.5 rounded-full bg-emerald-400"></div>
                </button>
            </div>
        </section>

        <!-- Athlete Feed: Desktop Expansion to Grid -->
        <section class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6">
            <!-- Athlete Card 1: Marcus Thorne -->
            <div class="athlete-card glass p-5 rounded-[2rem] transition-all duration-300 relative overflow-hidden flex flex-col">
                <div class="scan-line"></div>
                <div class="flex justify-between items-start mb-6">
                    <div class="flex items-center gap-4">
                        <div class="relative">
                            <div class="w-16 h-16 rounded-2xl overflow-hidden bg-indigo-950/50 border border-indigo-500/30 flex items-center justify-center">
                                <!-- Local SVG Avatar (Technical Silhouette) -->
                                <svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
                                    <circle cx="32" cy="20" r="8" stroke="#6366f1" stroke-width="2"/>
                                    <path d="M16 52C16 42 24 34 32 34C40 34 48 42 48 52" stroke="#6366f1" stroke-width="2" stroke-linecap="round"/>
                                    <path d="M32 34V44M24 40L32 44L40 40" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="2 2"/>
                                </svg>
                            </div>
                            <div class="absolute -bottom-1 -right-1 w-6 h-6 bg-indigo-600 rounded-lg flex items-center justify-center border-2 border-[#0a0a0c]">
                                <span class="text-[9px] font-bold text-white">OH</span>
                            </div>
                        </div>
                        <div>
                            <div class="text-[2.5rem] font-black leading-[0.85] text-indigo-400 tracking-tighter drop-shadow-[0_0_10px_rgba(99,102,241,0.3)]">#42</div>
                            <div class="text-[10px] font-bold text-white/40 uppercase tracking-[0.2em] mt-2">Marcus Thorne</div>
                        </div>
                    </div>
                    <button class="p-3 rounded-2xl bg-orange-500/20 border border-orange-500/30 text-orange-500 hover:bg-orange-500/30 transition-colors">
                        <i data-lucide="flag" class="w-5 h-5 fill-current"></i>
                    </button>
                </div>

                <!-- Redesigned Evaluation Scale: Explicit 0-3 -->
                <div class="space-y-5 mb-8 flex-grow">
                    <!-- Metric 1 -->
                    <div class="space-y-2">
                        <div class="flex justify-between items-center mb-1">
                            <label class="text-[10px] font-black text-white/60 uppercase tracking-widest">Perception</label>
                            <span class="text-xs font-black text-indigo-400 bg-indigo-500/10 px-2 py-0.5 rounded border border-indigo-500/20">3.0</span>
                        </div>
                        <div class="flex gap-2 h-3">
                            <button class="flex-1 rating-segment rounded-sm active" title="1"></button>
                            <button class="flex-1 rating-segment rounded-sm active" title="2"></button>
                            <button class="flex-1 rating-segment rounded-sm active" title="3"></button>
                        </div>
                    </div>
                    <!-- Metric 2 -->
                    <div class="space-y-2">
                        <div class="flex justify-between items-center mb-1">
                            <label class="text-[10px] font-black text-white/60 uppercase tracking-widest">Adaptability</label>
                            <span class="text-xs font-black text-indigo-400 bg-indigo-500/10 px-2 py-0.5 rounded border border-indigo-500/20">2.0</span>
                        </div>
                        <div class="flex gap-2 h-3">
                            <button class="flex-1 rating-segment rounded-sm active" title="1"></button>
                            <button class="flex-1 rating-segment rounded-sm active" title="2"></button>
                            <button class="flex-1 rating-segment rounded-sm" title="3"></button>
                        </div>
                    </div>
                    <!-- Metric 3 -->
                    <div class="space-y-2">
                        <div class="flex justify-between items-center mb-1">
                            <label class="text-[10px] font-black text-white/60 uppercase tracking-widest">Engagement</label>
                            <span class="text-xs font-black text-white/20 bg-white/5 px-2 py-0.5 rounded border border-white/10">0.0</span>
                        </div>
                        <div class="flex gap-2 h-3">
                            <button class="flex-1 rating-segment rounded-sm" title="1"></button>
                            <button class="flex-1 rating-segment rounded-sm" title="2"></button>
                            <button class="flex-1 rating-segment rounded-sm" title="3"></button>
                        </div>
                    </div>
                </div>

                <div class="flex gap-2 mt-auto">
                    <button class="flex-1 py-3 rounded-xl glass border-white/5 text-xs font-bold hover:bg-white/10 transition-all uppercase tracking-widest">Add Note</button>
                    <button class="flex-1 py-3 rounded-xl bg-indigo-600 border border-indigo-500 text-white text-xs font-bold hover:bg-indigo-500 transition-all uppercase tracking-widest shadow-lg shadow-indigo-600/20">Save</button>
                </div>
            </div>

            <!-- Athlete Card 2: Elena Rodriguez -->
            <div class="athlete-card glass p-5 rounded-[2rem] transition-all duration-300 relative overflow-hidden flex flex-col">
                <div class="flex justify-between items-start mb-6">
                    <div class="flex items-center gap-4">
                        <div class="relative">
                            <div class="w-16 h-16 rounded-2xl overflow-hidden bg-emerald-950/50 border border-emerald-500/30 flex items-center justify-center">
                                <svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
                                    <circle cx="32" cy="20" r="8" stroke="#10b981" stroke-width="2"/>
                                    <path d="M16 52C16 42 24 34 32 34C40 34 48 42 48 52" stroke="#10b981" stroke-width="2" stroke-linecap="round"/>
                                    <path d="M20 20L28 28M36 28L44 20" stroke="#10b981" stroke-width="1.5" stroke-dasharray="2 2"/>
                                </svg>
                            </div>
                            <div class="absolute -bottom-1 -right-1 w-6 h-6 bg-emerald-600 rounded-lg flex items-center justify-center border-2 border-[#0a0a0c]">
                                <span class="text-[9px] font-bold text-white">S</span>
                            </div>
                        </div>
                        <div>
                            <div class="text-[2.5rem] font-black leading-[0.85] text-indigo-400 tracking-tighter drop-shadow-[0_0_10px_rgba(99,102,241,0.3)]">#18</div>
                            <div class="text-[10px] font-bold text-white/40 uppercase tracking-[0.2em] mt-2">Elena Rodriguez</div>
                        </div>
                    </div>
                    <button class="p-3 rounded-2xl bg-white/5 border border-white/10 text-white/20 hover:text-orange-500 hover:border-orange-500/20 transition-colors">
                        <i data-lucide="flag" class="w-5 h-5"></i>
                    </button>
                </div>

                <div class="space-y-5 mb-8 flex-grow">
                    <div class="space-y-2">
                        <div class="flex justify-between items-center mb-1">
                            <label class="text-[10px] font-black text-white/60 uppercase tracking-widest">Perception</label>
                            <span class="text-xs font-black text-indigo-400 bg-indigo-500/10 px-2 py-0.5 rounded border border-indigo-500/20">1.0</span>
                        </div>
                        <div class="flex gap-2 h-3">
                            <button class="flex-1 rating-segment rounded-sm active" title="1"></button>
                            <button class="flex-1 rating-segment rounded-sm" title="2"></button>
                            <button class="flex-1 rating-segment rounded-sm" title="3"></button>
                        </div>
                    </div>
                    <div class="space-y-2">
                        <div class="flex justify-between items-center mb-1">
                            <label class="text-[10px] font-black text-white/60 uppercase tracking-widest">Adaptability</label>
                            <span class="text-xs font-black text-indigo-400 bg-indigo-500/10 px-2 py-0.5 rounded border border-indigo-500/20">3.0</span>
                        </div>
                        <div class="flex gap-2 h-3">
                            <button class="flex-1 rating-segment rounded-sm active" title="1"></button>
                            <button class="flex-1 rating-segment rounded-sm active" title="2"></button>
                            <button class="flex-1 rating-segment rounded-sm active" title="3"></button>
                        </div>
                    </div>
                    <div class="space-y-2">
                        <div class="flex justify-between items-center mb-1">
                            <label class="text-[10px] font-black text-white/60 uppercase tracking-widest">Engagement</label>
                            <span class="text-xs font-black text-indigo-400 bg-indigo-500/10 px-2 py-0.5 rounded border border-indigo-500/20">2.0</span>
                        </div>
                        <div class="flex gap-2 h-3">
                            <button class="flex-1 rating-segment rounded-sm active" title="1"></button>
                            <button class="flex-1 rating-segment rounded-sm active" title="2"></button>
                            <button class="flex-1 rating-segment rounded-sm" title="3"></button>
                        </div>
                    </div>
                </div>

                <div class="flex gap-2 mt-auto">
                    <button class="flex-1 py-3 rounded-xl glass border-white/5 text-xs font-bold hover:bg-white/10 transition-all uppercase tracking-widest">Add Note</button>
                    <button class="flex-1 py-3 rounded-xl bg-indigo-600 border border-indigo-500 text-white text-xs font-bold hover:bg-indigo-500 transition-all uppercase tracking-widest">Save</button>
                </div>
            </div>

            <!-- Athlete Card 3: New Athlete for Grid context -->
            <div class="athlete-card glass p-5 rounded-[2rem] transition-all duration-300 relative overflow-hidden flex flex-col">
                <div class="flex justify-between items-start mb-6">
                    <div class="flex items-center gap-4">
                        <div class="relative">
                            <div class="w-16 h-16 rounded-2xl overflow-hidden bg-indigo-950/50 border border-indigo-500/30 flex items-center justify-center">
                                <svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
                                    <circle cx="32" cy="20" r="8" stroke="#6366f1" stroke-width="2"/>
                                    <path d="M16 52L24 44L32 52L40 44L48 52" stroke="#6366f1" stroke-width="2" stroke-linecap="round"/>
                                </svg>
                            </div>
                            <div class="absolute -bottom-1 -right-1 w-6 h-6 bg-indigo-600 rounded-lg flex items-center justify-center border-2 border-[#0a0a0c]">
                                <span class="text-[9px] font-bold text-white">MB</span>
                            </div>
                        </div>
                        <div>
                            <div class="text-[2.5rem] font-black leading-[0.85] text-indigo-400 tracking-tighter drop-shadow-[0_0_10px_rgba(99,102,241,0.3)]">#07</div>
                            <div class="text-[10px] font-bold text-white/40 uppercase tracking-[0.2em] mt-2">Jaxon Reed</div>
                        </div>
                    </div>
                    <button class="p-3 rounded-2xl bg-white/5 border border-white/10 text-white/20 hover:text-orange-500 hover:border-orange-500/20 transition-colors">
                        <i data-lucide="flag" class="w-5 h-5"></i>
                    </button>
                </div>

                <div class="space-y-5 mb-8 flex-grow text-center py-10 opacity-30">
                    <i data-lucide="lock" class="w-8 h-8 mx-auto mb-2 text-white/40"></i>
                    <p class="text-[10px] font-bold uppercase tracking-widest">Pending Evaluation</p>
                </div>

                <div class="flex gap-2 mt-auto">
                    <button class="flex-1 py-3 rounded-xl bg-indigo-600 border border-indigo-500 text-white text-xs font-bold hover:bg-indigo-500 transition-all uppercase tracking-widest">Start Evaluation</button>
                </div>
            </div>
        </section>

        <!-- Empty State / Pagination Hint -->
        <div class="mt-12 text-center opacity-30">
            <p class="text-[10px] font-bold uppercase tracking-[0.3em]">End of feed • 42/128 Athletes Ranked</p>
        </div>
    </main>

    <!-- Bottom Dock Fix: Higher z-index and explicit bottom safe area -->
    <div class="fixed bottom-0 left-0 w-full h-32 bg-gradient-to-t from-[#0a0a0c] to-transparent pointer-events-none z-40"></div>
    <nav class="fixed bottom-6 left-1/2 -translate-x-1/2 w-[calc(100%-3rem)] max-w-sm glass p-2 rounded-3xl flex items-center justify-between border border-white/20 shadow-[0_20px_50px_rgba(0,0,0,0.5)] z-50">
        <button class="p-4 rounded-2xl bg-indigo-600 text-white shadow-[0_0_20px_rgba(99,102,241,0.4)]">
            <i data-lucide="layout-grid" class="w-6 h-6"></i>
        </button>
        <button class="p-4 rounded-2xl text-white/40 hover:text-white transition-colors relative group">
            <i data-lucide="clipboard-check" class="w-6 h-6"></i>
            <span class="absolute -top-1 -right-1 w-2 h-2 bg-indigo-500 rounded-full scale-0 group-hover:scale-100 transition-transform"></span>
        </button>
        <button class="p-4 rounded-2xl text-white/40 hover:text-white transition-colors relative group">
            <i data-lucide="user-plus" class="w-6 h-6"></i>
        </button>
        <button class="p-4 rounded-2xl text-white/40 hover:text-white transition-colors relative group">
            <i data-lucide="settings" class="w-6 h-6"></i>
        </button>
    </nav>

    <script>
        // Initialize Lucide icons
        lucide.createIcons();
    </script>
</body>
</html>
